[package]
name = "yier-bubu-desktop-pet"
version = "0.5.22"
description = "一二与布布的双人私人桌宠"
authors = ["一二与布布"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yier_bubu_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "rustls"] }
semver = "1"
sha2 = "0.10"
spake2 = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
futures-util = "0.3"
minisign-verify = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tokio = { version = "1", features = ["sync", "time"] }
xcap = "0.9.8"
battery = "0.7.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDataProvider", "CGDirectDisplay", "CGEventSource", "CGEventTypes", "CGImage", "CGWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSProcessInfo"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
] }
