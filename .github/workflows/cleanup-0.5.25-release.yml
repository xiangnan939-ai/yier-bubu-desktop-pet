name: 清理 0.5.25 重复发布附件

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-0.5.25-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 删除不参与安装和更新的重复附件
        shell: bash
        run: |
          for ASSET in \
            "_0.5.25_x64-setup.exe" \
            "_0.5.25_x64-setup.exe.sig" \
            "_aarch64.app.tar.gz" \
            "_aarch64.app.tar.gz.sig"; do
            gh release delete-asset app-v0.5.25 "$ASSET" \
              --repo "$GITHUB_REPOSITORY" --yes
          done
