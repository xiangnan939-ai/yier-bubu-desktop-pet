name: 临时清理有问题的历史版本

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-buggy-releases.yml"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 只保留确认可用的版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAGS: "app-v0.5.18 app-v0.5.24 app-v0.5.30"
        shell: bash
        run: |
          set -euo pipefail

          keep_tag() {
            case " ${KEEP_TAGS} " in
              *" $1 "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          echo "保留版本：${KEEP_TAGS}"
          echo "删除除保留版本以外的 app-v* GitHub Release..."
          while IFS= read -r tag; do
            [[ "${tag}" == app-v* ]] || continue
            if keep_tag "${tag}"; then
              echo "保留 release ${tag}"
            else
              echo "删除 release ${tag}"
              gh release delete "${tag}" --yes --cleanup-tag || true
            fi
          done < <(gh release list --limit 200 --json tagName --jq '.[].tagName')

          echo "删除仍残留的 app-v* git tag..."
          while IFS= read -r tag; do
            [[ "${tag}" == app-v* ]] || continue
            if keep_tag "${tag}"; then
              echo "保留 tag ${tag}"
            else
              echo "删除 tag ${tag}"
              git push origin ":refs/tags/${tag}" || true
            fi
          done < <(git ls-remote --tags --refs origin "refs/tags/app-v*" | awk '{ sub("refs/tags/", "", $2); print $2 }')
