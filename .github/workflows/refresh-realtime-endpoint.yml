name: 刷新桌宠联网入口

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-realtime-endpoint
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
      PROJECT_HOST: yier-bubu-private-realtime-btqjaq8u.edgeone.dev
    steps:
      - uses: actions/checkout@v4
      - name: 获取新的三小时访问凭证
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            'https://pages-api.cloud.tencent.com/v1' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${EDGEONE_PAGES_API_TOKEN}" \
            --data "$(jq -nc --arg host "${PROJECT_HOST}" \
              '{Action:"DescribePagesEncipherToken",Text:$host}')")"
          test "$(jq -r '.Code' <<<"${RESPONSE}")" = "0"
          TOKEN="$(jq -r '.Data.Response.Token' <<<"${RESPONSE}")"
          TIMESTAMP="$(jq -r '.Data.Response.Timestamp' <<<"${RESPONSE}")"
          test -n "${TOKEN}"
          test "${TIMESTAMP}" -gt 0
          jq -n \
            --arg endpoint "https://${PROJECT_HOST}?eo_token=${TOKEN}&eo_time=${TIMESTAMP}" \
            --argjson expiresAtMs "$((TIMESTAMP * 1000 + 3 * 60 * 60 * 1000))" \
            '{version:1, endpoint:$endpoint, expiresAtMs:$expiresAtMs}' \
            > realtime.json
      - name: 发布稳定下载地址
        shell: bash
        run: |
          mkdir "${RUNNER_TEMP}/runtime-config"
          mv realtime.json "${RUNNER_TEMP}/runtime-config/realtime.json"
          git switch --orphan runtime-config-publish
          git rm -rf .
          cp "${RUNNER_TEMP}/runtime-config/realtime.json" realtime.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add realtime.json
          git commit -m "chore: refresh realtime endpoint"
          git push --force origin HEAD:runtime-config
