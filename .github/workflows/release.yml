name: 发布 Mac 与 Windows 更新

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: 导入固定 Mac 代码签名
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CODE_SIGN_CERTIFICATE: ${{ secrets.MACOS_CODE_SIGN_CERTIFICATE }}
          MACOS_CODE_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODE_SIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="${RUNNER_TEMP}/yier-bubu-code-sign.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/yier-bubu-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "${MACOS_CODE_SIGN_CERTIFICATE}" \
            | openssl base64 -d -A -out "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CODE_SIGN_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security find-certificate -c 'Yier Bubu Private Code Signing' \
            "${KEYCHAIN_PATH}" >/dev/null
          echo 'APPLE_SIGNING_IDENTITY=Yier Bubu Private Code Signing' >> "${GITHUB_ENV}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          YIER_BUBU_APP_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          YIER_BUBU_APP_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "一二布布私人桌宠 ${{ github.ref_name }}"
          releaseBody: "Mac 与 Windows 联网更新包。"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: 上传 Mac 签名更新包
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          ARCHIVES=(src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)
          SIGNATURES=(src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig)
          test -f "${ARCHIVES[0]}"
          test -f "${SIGNATURES[0]}"
          cp "${ARCHIVES[0]}" "yier-bubu_${VERSION}_aarch64.app.tar.gz"
          cp "${SIGNATURES[0]}" "yier-bubu_${VERSION}_aarch64.app.tar.gz.sig"
          gh release upload "$GITHUB_REF_NAME" \
            "yier-bubu_${VERSION}_aarch64.app.tar.gz" \
            "yier-bubu_${VERSION}_aarch64.app.tar.gz.sig" --clobber

      - name: 上传 Windows 签名更新包
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          ARCHIVES=(src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe)
          SIGNATURES=(src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig)
          test -f "${ARCHIVES[0]}"
          test -f "${SIGNATURES[0]}"
          cp "${ARCHIVES[0]}" "yier-bubu_${VERSION}_x64-setup.exe"
          cp "${SIGNATURES[0]}" "yier-bubu_${VERSION}_x64-setup.exe.sig"
          gh release upload "$GITHUB_REF_NAME" \
            "yier-bubu_${VERSION}_x64-setup.exe" \
            "yier-bubu_${VERSION}_x64-setup.exe.sig" --clobber

  publish-release:
    needs: build-app
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 生成程序更新清单
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          mkdir -p release-assets/updater-signatures
          gh release download "$GITHUB_REF_NAME" \
            --pattern "yier-bubu_*.sig" \
            --dir release-assets/updater-signatures
          node scripts/make-updater-json.mjs \
            "$VERSION" release-assets/updater-signatures "$BASE_URL" release-assets/latest.json
      - name: 同步备用更新清单到仓库
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create update-manifest origin/main
          mkdir -p updater
          cp release-assets/latest.json updater/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update updater manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:main || echo "::warning::备用更新清单未能推送到 main，Release 更新清单仍然有效"
      - name: 上传更新清单并公开发布
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" release-assets/latest.json --clobber
          VERSION="${GITHUB_REF_NAME#app-v}"
          for ASSET in \
            "_${VERSION}_x64-setup.exe" \
            "_${VERSION}_x64-setup.exe.sig" \
            "_aarch64.app.tar.gz" \
            "_aarch64.app.tar.gz.sig"; do
            gh release delete-asset "$GITHUB_REF_NAME" "$ASSET" --yes
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
